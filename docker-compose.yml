services:
  db:
    image: mysql:8
    profiles:
      - dev
    container_name: mysql-dev
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USERNAME}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - '${DATABASE_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  mail:
    image: axllent/mailpit:latest
    profiles:
      - dev
    container_name: mailpit-dev
    ports:
      - '${MAIL_PORT:-1025}:1025'
      - '${MAIL_CLIENT_PORT:-8025}:8025'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - prod
    platform: ${PLATFORM}
    container_name: nest-app
    environment:
      - NODE_ENV
      - APP_NAME
      - APP_PORT
      - APP_FALLBACK_LANGUAGE
      - APP_HEADER_LANGUAGE
      - FRONTEND_DOMAIN
      - BACKEND_DOMAIN
      - PLATFORM

      - ADMIN_NAME
      - ADMIN_PASSWORD
      - ADMIN_EMAIL
      - AUTH_JWT_SECRET
      - AUTH_JWT_TOKEN_EXPIRES_IN
      - AUTH_REFRESH_SECRET
      - AUTH_REFRESH_TOKEN_EXPIRES_IN

      - DATABASE_TYPE
      - DATABASE_HOST
      - DATABASE_PORT
      - DATABASE_USERNAME
      - DATABASE_PASSWORD
      - DATABASE_NAME
      - DATABASE_SYNCHRONIZE
      - DATABASE_MAX_CONNECTIONS
      - DATABASE_SSL_ENABLED
      - DATABASE_REJECT_UNAUTHORIZED
      - DATABASE_CA
      - DATABASE_KEY
      - DATABASE_CERT

      - MAIL_HOST
      - MAIL_PORT
      - MAIL_USER
      - MAIL_PASSWORD
      - MAIL_IGNORE_TLS
      - MAIL_SECURE
      - MAIL_REQUIRE_TLS
      - MAIL_DEFAULT_EMAIL
      - MAIL_DEFAULT_NAME
      - MAIL_CLIENT_PORT
      - REJECT_UNAUTHORIZED

      - FILE_STORAGE_DRIVER
      - FILE_S3_ENDPOINT
      - FILE_S3_BUCKET
      - FILE_S3_REGION
      - FILE_S3_ACCESS_KEY
      - FILE_S3_SECRET_KEY
      - FILE_S3_PUBLIC_URL
      - FILE_S3_FORCE_PATH_STYLE
      - FILE_MAX_SIZE

      - AI_PROVIDER
      - AI_MODEL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
    ports:
      - '${APP_PORT}:${APP_PORT}'
    volumes:
      - ./src:/app/src
      - uploads:/app/uploads
    networks:
      coolify:
        # Стабільне DNS-імʼя в спільній мережі coolify: Coolify ігнорує
        # container_name і додає до імені контейнера timestamp, а аліас `app`
        # однаковий у прод- і стейджинг-бекенда. Фронтенд ходить сюди через
        # API_SERVER_INTERNAL. Стейджинг МУСИТЬ задати APP_NETWORK_ALIAS
        # (nest-app-staging) у env Coolify, інакше повернеться колізія імен.
        aliases:
          - ${APP_NETWORK_ALIAS:-nest-app}
volumes:
  uploads:
  mysql_data:

networks:
  coolify:
    external: true